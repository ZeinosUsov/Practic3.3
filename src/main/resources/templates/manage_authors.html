<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Управление авторами</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            padding: 10px 20px;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            margin: 10px 0;
            transition: background-color 0.3s;
        }

        .btn:hover {
            background-color: #2980b9;
        }

        .back-btn {
            background-color: #95a5a6;
        }

        .back-btn:hover {
            background-color: #7f8c8d;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Список авторов</h1>

        <a href="/manage_authors/add" class="btn">Добавить автора</a>
        <a href="/" class="btn back-btn">На главную</a>

        <table style="width: 100%; margin-top: 20px; border-collapse: collapse;">
            <thead>
            <tr style="background-color: #f2f2f2;">
                <th style="padding: 12px; text-align: left; border-bottom: 1px solid #ddd;">ID</th>
                <th style="padding: 12px; text-align: left; border-bottom: 1px solid #ddd;">Фамилия</th>
                <th style="padding: 12px; text-align: left; border-bottom: 1px solid #ddd;">Имя</th>
                <th style="padding: 12px; text-align: left; border-bottom: 1px solid #ddd;">Отчество</th>
                <th style="padding: 12px; text-align: left; border-bottom: 1px solid #ddd;">Действия</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="author : ${authors}" style="border-bottom: 1px solid #ddd;">
                <td style="padding: 12px;" th:text="${author.id}"></td>
                <td style="padding: 12px;" th:text="${author.lastName}"></td>
                <td style="padding: 12px;" th:text="${author.name}"></td>
                <td style="padding: 12px;" th:text="${author.surname}"></td>
                <td style="padding: 12px;">
                    <form th:action="@{/delete/{id}(id=${author.id})}" method="post" style="display: inline;">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button type="submit" style="background-color: #e74c3c; color: white; border: none; padding: 5px 10px; border-radius: 3px; cursor: pointer;">Удалить</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
