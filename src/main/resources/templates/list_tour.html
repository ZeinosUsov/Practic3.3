<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Список Туров</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
            position: relative;
        }

        .tour-table {
            border-collapse: collapse;
            width: 90%;
            margin: 20px auto;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .tour-table th, .tour-table td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }

        .tour-table th {
            background-color: #4a90e2;
            color: white;
        }

        .tour-table tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        .tour-table tr:hover {
            background-color: #f1f1f1;
        }

        /* Стили для кнопки "Удалить" */
        .tour-table form button[type="submit"] {
            background-color: #dc3545;
            color: white;
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .tour-table form button[type="submit"]:hover {
            background-color: #c82333;
        }

        /* Ссылка "Добавить тур" */
        a[href="/Tour/add"] {
            display: inline-block;
            margin: 20px 0 10px 5%;
            padding: 8px 16px;
            background-color: #28a745;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            transition: background-color 0.3s ease;
        }

        a[href="/Tour/add"]:hover {
            background-color: #218838;
        }

        .logout-btn {
            background: linear-gradient(to right, #4a90e2, #63b8ff);
            color: white;
            padding: 10px 20px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            transition: box-shadow 0.3s ease;
            position: absolute;
            top: 20px;
            right: 20px;
        }

        .logout-btn:hover {
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            text-decoration: none;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
<a href="/" class="logout-btn">
    <i>Выйти</i>
</a>

<h1>Список Туров</h1>

<a href="/Product/add">Добавить тур</a>

<table class="Product-table">
    <thead>
    <tr>
        <th>ID</th>
        <th>Название</th>
        <th>Описание</th>
        <th>Цена</th>
        <th>Действия</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="tour : ${Tour}">
        <td th:text="${tour.id}"></td>
        <td th:text="${tour.title}"></td>
        <td th:text="${tour.description}"></td>
        <td th:text="${'$' + tour.price}"></td>
        <td>
            <form th:action="@{/Tour/delete/{id}(id=${tour.id})}" method="post">
                <button type="submit">Удалить</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
